server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # 性能优化（Task 1）：隐藏版本号 + 开启 gzip + 静态资源长缓存
    server_tokens off;

    # gzip 压缩：HTML/CSS/JS/JSON/SVG/字体经 frp 隧道传输时显著减小体积
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # 大文件上传（出片素材）支持
    # 上限 96MB 的真实依据（2026-10-05 实测）：访客 → 国内服务器 124.223.14.171 → frp 隧道 → 本机，
    #   服务器出网带宽约 3Mbps（0.33MB/s），96MB 约需 5 分钟；再放宽也没用（传不完还超时）。
    #   ⚠️ Cloudflare 已于 2026-10-05 撤出链路，此处不再受其 100MB 单请求硬限约束，瓶颈是带宽。
    client_max_body_size 96m;

    # 慢速上传保护：96MB 经隧道约需 5 分钟，放宽请求体读取时限，避免网速抖动时中途被掐断
    client_body_timeout 600s;

    # 版本化构建产物（/build 下文件名带 hash）：永久缓存、不可变，重复访问秒开
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
        access_log off;
    }

    # 真人素材精剪产物（/studio/footage/play/*.mp4 等）：必须走 PHP 控制器鉴权+流式返回，
    # 不能被下面的静态资源规则拦截（否则 try_files 找不到文件直接 404）
    location ^~ /studio/footage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 发布包装封面（/studio/publish-pack/cover/*.jpg）：同上走 PHP 鉴权
    location ^~ /studio/publish-pack/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 图片/字体/视频等静态资源：长缓存
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OAuth2 授权码回调（抖音/小红书）：https://<平台域名>/oauth/callback/{platform}
    # → 代理到本机 8500 出片微服务。
    #   当前形态（2026-10-05 起）：国内服务器 nginx(443, SSL 终止) → frp 隧道 → 本 nginx:8080
    #     → host.docker.internal:8500。
    #   （旧 Cloudflare Tunnel 形态已撤除，故不再需要给 /oauth/* 配 Access Bypass。）
    location /oauth/ {
        proxy_pass http://host.docker.internal:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 关键：把 CF 传来的 X-Forwarded-Proto 透传给 8500，确保回调地址按 https 生成
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # 96MB 附件经 3Mbps 隧道上传约需 5 分钟，原 300s 余量仅 10 秒（实测卡边界）；
        # 放宽到 900s，让慢速上传能传完、拿到 job_id。
        fastcgi_read_timeout 900;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
