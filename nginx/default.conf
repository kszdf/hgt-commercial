server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # 性能优化（Task 1）：隐藏版本号 + 开启 gzip + 静态资源长缓存
    server_tokens off;

    # gzip 压缩：HTML/CSS/JS/JSON/SVG/字体经 frp 隧道传输时显著减小体积
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # 大文件上传（出片素材）支持
    client_max_body_size 256m;

    # 版本化构建产物（/build 下文件名带 hash）：永久缓存、不可变，重复访问秒开
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
        access_log off;
    }

    # 图片/字体/视频等静态资源：长缓存
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
