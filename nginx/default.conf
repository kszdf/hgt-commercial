server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # 性能优化（Task 1）：隐藏版本号 + 开启 gzip + 静态资源长缓存
    server_tokens off;

    # gzip 压缩：HTML/CSS/JS/JSON/SVG/字体经 frp 隧道传输时显著减小体积
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # 大文件上传（出片素材）支持
    client_max_body_size 256m;

    # 版本化构建产物（/build 下文件名带 hash）：永久缓存、不可变，重复访问秒开
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
        access_log off;
    }

    # 真人素材精剪产物（/studio/footage/play/*.mp4 等）：必须走 PHP 控制器鉴权+流式返回，
    # 不能被下面的静态资源规则拦截（否则 try_files 找不到文件直接 404）
    location ^~ /studio/footage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 图片/字体/视频等静态资源：长缓存
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OAuth2 授权码回调（抖音/小红书）：https://zmgen.cn/oauth/callback/{platform}
    # → 代理到本机 8500 出片微服务（frp 已把云端 8500 映射到本机 8500，
    #   但回调由用户浏览器直连 zmgen.cn，走本 nginx 转发最稳）
    location /oauth/ {
        proxy_pass http://host.docker.internal:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
