services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    networks:
      - hgt
    # 长任务（视频出片）后续接 Laravel 队列 worker，这里先留出
    # command: php artisan queue:work

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"   # 宿主 8080 -> 新平台预览（避开 8385）
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hgt

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hgt_commercial
      MYSQL_ROOT_PASSWORD: rootpass_change_me
      MYSQL_USER: hgt
      MYSQL_PASSWORD: hgtpass_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hgt
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    networks:
      - hgt

volumes:
  mysql_data:

networks:
  hgt:
    driver: bridge
