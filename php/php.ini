; 商用平台 PHP-FPM 运行时配置（挂载到容器 /usr/local/etc/php/conf.d/zz-platform.ini）
; 核心：放开大文件上传（真人素材精剪 ≤500MB，nginx client_max_body_size 256m 已配）

upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 20
memory_limit = 512M
; 对话出稿"全写"N 篇口播稿实测 200~280s（每篇一次 LLM 长调用）。
; 同步阶段需跑满长任务：CLI(8500) 300s + 前端兜底 330s，故这里放开到 330s，
; 避免 PHP 在 Laravel/前端之前先掐断导致误判 502。真正根治见异步 job 化改造。
max_execution_time = 330
max_input_time = 330

; ==================== OPcache 调优（2026-09-11 页面打开缓慢修复） ====================
; 背景：项目以 bind mount 方式挂在 Windows 磁盘上（./:/var/www），
;       容器内单次文件读取实测 1.96ms（正常 Linux 约 0.02ms，慢近百倍）。
;       因此必须让 OPcache 尽量把全部 PHP 字节码常驻内存，避免每个请求重复跨层读盘。
;
; 关键：项目文件总量约 17900 个（vendor 11348 + 源码/其他 6500+），
;       原 max_accelerated_files=10000 装不下 → 反复淘汰重编译 → 请求耗时忽高忽低。
opcache.enable = 1
opcache.memory_consumption = 256        ; 128M 装不下全部字节码，提到 256M
opcache.interned_strings_buffer = 32    ; 字符串驻留区 8M→32M
opcache.max_accelerated_files = 20000   ; 必须 > 17900，否则缓存击穿
opcache.revalidate_freq = 60            ; 跨层 stat 慢，检查频率 2s→60s（改代码最多 1 分钟生效）
opcache.validate_timestamps = 1         ; 保持 1：改 PHP 后 60s 内自动生效，无需重启容器
opcache.save_comments = 1               ; 必须为 1，Laravel 注解依赖注释解析
opcache.max_wasted_percentage = 10
