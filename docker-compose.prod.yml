# 生产部署（云服务器 hgtcs）— 混合云路线 A
# 用法：docker compose -f docker-compose.prod.yml up -d
# 说明：nginx 对外 80；mysql/redis 仅内部网络，不暴露到公网。
# 出片微服务仍在本地 Windows，经 frp 暴露，由 PYTHON_PIPELINE_URL 指向。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    networks:
      - hgt

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hgt

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hgt_commercial
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_USER: hgt
      MYSQL_PASSWORD: ${DB_PASSWORD:-hgtpass_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hgt
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    networks:
      - hgt

volumes:
  mysql_data:

networks:
  hgt:
    driver: bridge
